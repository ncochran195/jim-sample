# Shared by the QA and stage apps: each deploy names its app with --app, and
# each app's DATABASE_URL is a Fly secret pointing at its own Neon branch.
primary_region = "ord"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: a sleeping app would look like a QA outage.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  memory = "256mb"
  cpus = 1
