# Managed by JIM: changes come through JIM's template PRs, which a trusted
# member reviews. The required `ci` check. It holds no secrets and can only
# read the repo, so a PR can't use it to reach anything else.
name: ci

on:
  pull_request:
  push:
    branches: ["release/*"]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:feature
